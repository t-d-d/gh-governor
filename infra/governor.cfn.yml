AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Governor: a Fargate task that starts Claude Code cloud sessions from a
  stored claude.ai login, on a schedule and on the GitHub events its webhook
  receiver takes (an issue event that changes the selection, a mention of
  @claude). Every fire waits its turn on one FIFO lane, and a starter runs
  one task at a time. Applied by .github/workflows/deploy.yml, which also
  builds the image.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  ImageUri:
    Type: String
    Description: >
      Digest-pinned image URI (repo@sha256:…) of dispatch/Dockerfile, from
      .github/actions/image; the workflow derives the tag from the image's
      inputs and builds only when the tag is new.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Where the task runs: the default VPC's subnets, which the workflow
      reads (ec2 describe-subnets, default-for-az) and passes in. They are
      public, so a task with a public IP reaches ECR, GitHub and claude.ai
      through the internet gateway with no NAT to pay for. The VPC's default
      security group applies, which allows all egress.

  DispatchOwners:
    Type: String
    AllowedPattern: '^[A-Za-z0-9-]+(,[A-Za-z0-9-]+)*$'
    Description: >
      The GitHub accounts whose App installations governor serves,
      comma-separated. The receiver queues nothing for a delivery from any
      other account, and the task reads no installation on one. Adding an
      owner is a deploy, deliberately.

  SelectLabels:
    Type: String
    Default: ''
    Description: >
      The labels whose addition to an issue queues a selection fire, in
      every served repo, comma-separated. The receiver reads no repo's
      config file, so it cannot tell a ready label from any other; the turn
      still checks the label against the repo's ready labels. Empty means
      every label selects. A repo whose ready label is not listed is picked
      up by the hourly schedule fire instead.

  GitHubAppId:
    Type: String
    AllowedPattern: '^[1-9][0-9]*$'
    Description: >
      The GitHub App's ID. The webhook receiver takes a comment carrying the
      PR review's marker for the review's only when this App posted it.

  # The deploy passes this value too (.github/workflows/deploy.yml):
  # `aws cloudformation deploy` keeps a parameter it is not given, so a new
  # default alone would never reach a deployed stack.
  ScheduleExpression:
    Type: String
    Default: cron(17 * * * ? *)
    Description: >
      When the schedule fire runs: every hour at :17. A served repo's
      watchdog that reads the heartbeat expects the same cadence.

  DispatchCap:
    Type: String
    Default: '2'
    Description: >
      How many issues one schedule fire may dispatch. Above two, a fire
      whose launches are slow stops short of it to end inside the task's
      deadline (dispatch/turn.mjs SCHEDULE_LAUNCH_WINDOW_MS).

  # Read from Parameter Store inside AWS on every apply, so the address never
  # passes through GitHub, whose run logs are public for this repo. The
  # operator saves it once (README, Fork and deploy); the deploy passes none.
  AlertEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /governor/alert-email
    Description: >
      The Parameter Store name of the address the alarms send their email
      to. The stack creates its own alerts topic and subscribes the address;
      the subscription waits until the address confirms it.

  DropBoxUrl:
    Type: String
    Default: ''
    Description: >
      Optional. The URL the PR review's transcripts are PUT under, with the
      writer credential the operator saves in governor/session-log-writer.
      Empty ships no transcript.

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:
  # The secrets the operator writes (governor/claude-login,
  # governor/github-app, governor/session-log-writer) live in the bootstrap
  # stack, infra/bootstrap.cfn.yml, so they exist before this stack's first
  # deploy and outlive a delete of it. This stack names them; Secrets Manager
  # ends each ARN with six random characters after the name.

  # ── The alerts ─────────────────────────────────────────────────────────────
  # Every alarm publishes here, and the topic emails AlertEmail once the
  # address has confirmed the subscription.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: governor-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ── The task ───────────────────────────────────────────────────────────────
  # The awslogs driver writes one stream per task beneath it,
  # named <prefix>/<container>/<task id>, which is how the probe finds the
  # run it started. DispatchNotRunRule and DispatchTaskStoppedRule write
  # each task's stop event into its own stream here too.
  DispatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /governor
      RetentionInDays: 30

  # The dispatcher's own state (docs/constraints/dispatcher-state.md):
  # one table, keyed pk/sk, each use a key prefix. First use: each label's
  # cursor under its workflow, the newest run whose news a turn planned.
  # No TableName,
  # so CloudFormation names it (governor-…, which the deploy role's
  # table grant matches) and a re-create cannot collide with a kept one. No
  # point-in-time recovery: a lost cursor falls back to the runs list.
  DispatchStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # The receiver's own table (dispatch/webhook/hook-table.mjs): one item per
  # served repo, listing each hook's name, key version and hourly cap, which
  # the task writes each time it reads the repo's file and the receiver reads
  # before it queues a hook fire; and one item per hook and clock hour, the
  # receiver's count of that hook's fires, expired by ttl. Apart from the
  # state table because the receiver is internet-facing and the state table
  # holds records other checks trust (docs/constraints/dispatcher-state.md).
  # Built the same way; no point-in-time recovery: a lost item costs task
  # starts, and the task still refuses a stale key.
  DispatchHookTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DispatchCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: governor

  # Least privilege, inline, where a test can read all of it
  # (test/dispatch-stack.test.ts). Three roles, each with one job. RoleName
  # is left generated, prefixed by the stack name, `governor-`.
  #
  # The task role: what the turn itself may do. The login read and written,
  # the App key and the drop-box writer read, the state table's items, the
  # fire lane taken from, counted and sent to, a refused fire moved to the
  # dead-letter queue, nothing else; the logs are the execution role's.
  DispatchRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The dispatcher task's role, what the turn runs as
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dispatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadTheSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:governor/claude-login-??????'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:governor/github-app-??????'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:governor/session-log-writer-??????'
              # The CLI rotates the refresh token when it refreshes; the
              # rotated login has to go back or the next turn holds a dead one.
              - Sid: WriteBackTheLogin
                Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:governor/claude-login-??????'
              # The task is the lane's only reader (dispatch/lane.mjs): it
              # takes each fire and deletes it before the fire's turn.
              - Sid: TakeTheFires
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !GetAtt DispatchFiresQueue.Arn
              # A fire the task's parser refuses goes to the dead-letter
              # queue at once, as it came.
              - Sid: RefuseAFire
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DispatchFiresDeadQueue.Arn
              # A turn that messaged sessions waits for their replies only
              # while no fire is queued (awaitReplies,
              # scripts/lib/session-signoff.mjs): it counts the lane.
              - Sid: CountTheFires
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !GetAtt DispatchFiresQueue.Arn
              # An issue closing queues one `unblocked` fire for each open
              # ticket it blocked, for the ticket's own repo's turn
              # (dispatch/unblocked.mjs). The task takes it off the lane
              # itself, after the turn that queued it.
              - Sid: QueueTheUnblockedFires
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DispatchFiresQueue.Arn
              # Each label's cursor under its workflow (dispatch/turn.mjs
              # dynamoState): read once a turn, written forward
              # after its sends. What a held cursor's range delivered: read,
              # and merged into.
              - Sid: ReadAndWriteTheState
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DispatchStateTable.Arn
              # Each served repo's hooks and switches, put each time the turn
              # reads its file (dispatch/webhook/hook-table.mjs); never read
              # back.
              - Sid: WriteTheHookTable
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt DispatchHookTable.Arn

  # The execution role: what ECS does on the task's behalf before and around
  # it. Pull the one image, write the one log group.
  DispatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The dispatcher task's execution role, for the image pull and the log driver
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The registry login takes no resource.
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              # The repository the workflow pushes to (.github/actions/image's
              # repo_name); the image URI's digest pins which image.
              - Sid: PullTheImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/governor'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # The group's Arn already ends in `:*`, which covers the
                # streams beneath it; a second `:*` would demand two segments
                # after the name and miss the group itself.
                Resource: !GetAtt DispatchLogGroup.Arn

  # Half a vCPU and a gigabyte: the turn is a Python launcher holding a
  # pseudo-terminal around the CLI, twice, and a few HTTPS calls. arm64,
  # which the image is built for and Fargate prices lowest.
  DispatchTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: governor
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !GetAtt DispatchRole.Arn
      ExecutionRoleArn: !GetAtt DispatchExecutionRole.Arn
      ContainerDefinitions:
        - Name: dispatch
          Image: !Ref ImageUri
          Essential: true
          # node is PID 1 in the container and PID 1 gets no default signal
          # handling: without an init, a stop-task's SIGTERM is dropped until
          # the SIGKILL thirty seconds later, and the launcher's orphaned
          # grandchildren are never reaped.
          LinuxParameters:
            InitProcessEnabled: true
          # DISPATCH_EVENT is deliberately absent: a task without it reads
          # the lane (dispatch/lane.mjs), and only a probe sets it
          # (scripts/run-turn.mjs).
          Environment:
            - Name: CLAUDE_LOGIN_SECRET_ID
              Value: governor/claude-login
            - Name: GITHUB_APP_SECRET_ID
              Value: governor/github-app
            - Name: DISPATCH_OWNERS
              Value: !Ref DispatchOwners
            - Name: DISPATCH_CAP
              Value: !Ref DispatchCap
            - Name: SESSION_LOG_SECRET_ID
              Value: governor/session-log-writer
            # Where the review's transcripts go; empty ships none.
            - Name: SESSION_LOG_URL
              Value: !Ref DropBoxUrl
            # Where each label's cursor under its workflow lives.
            - Name: DISPATCH_STATE_TABLE
              Value: !Ref DispatchStateTable
            - Name: DISPATCH_HOOK_TABLE
              Value: !Ref DispatchHookTable
            # The fire lane the task takes its fires off (dispatch/lane.mjs),
            # the sign-off wait counts (scripts/lib/session-signoff.mjs),
            # and a close's unblocked fires go on (dispatch/unblocked.mjs).
            - Name: DISPATCH_FIRES_QUEUE_URL
              Value: !Ref DispatchFiresQueue
            # Where a fire the task refuses goes.
            - Name: DISPATCH_FIRES_DEAD_QUEUE_URL
              Value: !Ref DispatchFiresDeadQueue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DispatchLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task

  # ── The schedule ───────────────────────────────────────────────────────────
  # The rule invokes the webhook receiver below with the schedule event,
  # rather than running the task itself, so the schedule fire joins the same
  # lane a webhook delivery's does: a task a delivery started at :10 is
  # still running at :17, and two turns would refresh one login. The
  # receiver then calls the starter, as for any fire it queues. A receiver
  # EventBridge could not invoke is retried, inside the lane's five-minute
  # deduplication window, so a retry of a fire the receiver did queue is not
  # a second fire.
  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: governor-schedule
      Description: The pickup cadence; the payload names the fire so the receiver never guesses
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: dispatch
          Arn: !GetAtt WebhookFunction.Arn
          Input: '{"kind":"schedule"}'
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

  # ── The alarms ─────────────────────────────────────────────────────────────
  # A turn that could not dispatch says so on one log line, `dispatch-failed`
  # (dispatch/cli.mjs): a login the secret no longer holds, a GitHub read
  # refused, a launcher that cannot start, a deadline. A message into an
  # archived session, or a review the login's session limit refused
  # (dispatch/checklist.mjs usageLimit), logs `dispatch-result` instead.
  # Keyed on the event, never on a level
  # (a level is the code's choice; an event is a fact). A served repo's
  # watchdog would notice the missing heartbeat within a day; this says so
  # within fifteen minutes.
  DispatchFailuresFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-failed" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: Failures
          MetricValue: '1'
          DefaultValue: 0

  DispatchErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-errors
      AlarmDescription: '[tripwire] A dispatcher turn failed. Read /governor for the dispatch-failed line it logged.'
      Namespace: governor
      MetricName: Failures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A workflow turn that refuses to plan from a runs list lacking its run
  # (dispatch/workflow.mjs) exits 0, so the filter above never hears
  # it. A run of stale answers from the API would silence every deploy
  # notice, and the sessions they were for never sign off. The
  # refusal logs `dispatch-stale-runs`, naming the run and the newest run the
  # list held. A turn that cannot read its label's cursor, or what the
  # cursor's range has delivered, refuses the same way. A refused turn leaves the cursor, so the next run of the workflow
  # covers the refused run's merges: the page asks for hand work only
  # when no next run comes.
  DispatchStaleRunsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-stale-runs" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: StaleRuns
          MetricValue: '1'
          DefaultValue: 0

  DispatchStaleRunsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-stale-runs
      AlarmDescription: '[tripwire] A workflow turn refused to tell a run''s sessions: the Actions runs list still lacked the run after every re-read, or the workflow''s cursor, or what its range has delivered, could not be read from the dispatcher''s state table. Read /governor for the dispatch-stale-runs line; it names the run and why. The next run of the same workflow on main tells the refused run''s merges: the next green deploy tells and labels what it shipped, and the next red CI counts its merges among the suspects. Only when no next run comes (a red CI followed by green ones), or that turn refuses too, tell the run''s PRs by hand: a deploy''s that it shipped, a red CI''s suspects that it broke main.'
      Namespace: governor
      MetricName: StaleRuns
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The login's refresh expiry is fixed at mint, about 14 days on; refreshes
  # do not move it. Past it the dispatcher stops and
  # DispatchErrorsAlarm pages, too late. Each turn within
  # LOGIN_EXPIRY_WARNING_MS (scripts/lib/claude-login.mjs, three days) of it
  # logs `dispatch-login-expiring` (dispatch/turn.mjs). A day's period, not
  # fifteen minutes: turns run every hour or less, so each day of the
  # window holds a line and the alarm stays in ALARM, one page, until a
  # re-mint; the next day's turns publish 0 (DefaultValue) and clear it.
  DispatchLoginExpiringFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-login-expiring" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: LoginExpiring
          MetricValue: '1'
          DefaultValue: 0

  DispatchLoginExpiringAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-login-expiring
      AlarmDescription: '[tripwire] The dispatcher''s stored claude.ai login reaches its refresh expiry within three days, and refreshes do not extend it. Read /governor for the dispatch-login-expiring line; it names the expiry. Re-mint before then: node scripts/mint-claude-login.mjs --profile admin.'
      Namespace: governor
      MetricName: LoginExpiring
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # The dispatcher claims a ticket before it launches the ticket's session.
  # A claim whose turn ends with no dispatch marker naming a session
  # (an unconfirmed launch, one past its budget, a thrown turn, the deadline)
  # logs `dispatch-claim-stranded` naming the ticket (dispatch/turn.mjs,
  # dispatch/cli.mjs). The ticket stays under development, so no fire picks
  # it again: a person decides whether a session is on it.
  DispatchClaimStrandedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-claim-stranded" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: ClaimsStranded
          MetricValue: '1'
          DefaultValue: 0

  DispatchClaimStrandedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-claim-stranded
      AlarmDescription: '[tripwire] The dispatcher claimed a ticket (workflow: under development) and no dispatch marker names the session it launched for it, so no fire will pick the ticket again. Read /governor for the dispatch-claim-stranded line; it names the ticket. Look in the sessions list for a session named after it: if one is working, leave it; if none is, put workflow: ready for development back and take workflow: under development off.'
      Namespace: governor
      MetricName: ClaimsStranded
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Governor records every session it starts in the state table, so the PR
  # review gives that session's PRs no human-only waiver from a ticket's
  # mode label. A record that fails to write logs
  # `dispatch-session-unrecorded` naming the session (dispatch/turn.mjs),
  # and the turn carries on, since the session is already running. A launch
  # that may have started a session but printed no URL logs the same line
  # with no session, only the session name.
  DispatchSessionUnrecordedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-session-unrecorded" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: SessionsUnrecorded
          MetricValue: '1'
          DefaultValue: 0

  DispatchSessionUnrecordedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-session-unrecorded
      AlarmDescription: '[tripwire] Governor started a session and could not record it in the state table, so the PR review treats that session as not its own: its PRs can clear a human-only path when the tickets they close carry one of that path''s unless labels, such as mode: hitl. Read /governor for the dispatch-session-unrecorded line; it names the session and the error. Put the item pk session#<session id>, sk started in the dispatcher''s state table, or review that session''s PRs yourself before any merge. When the line names no session, the launch may have started one it did not print: look in the sessions list for one with the line''s session name, started at the line''s time, and record it or review its PRs by hand.'
      Namespace: governor
      MetricName: SessionsUnrecorded
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A served repo's config file that fails its schema (dispatch/repos.mjs,
  # dispatch/repo-config.mjs) leaves the repo unserved until it is fixed: no
  # dispatch, no archiving. Each turn that reads it logs
  # `dispatch-config-invalid` naming the repo and the fault. A repo with no
  # file logs `dispatch-not-served` at info and pages nobody.
  DispatchConfigInvalidFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-config-invalid" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: ConfigInvalid
          MetricValue: '1'
          DefaultValue: 0

  DispatchConfigInvalidAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-config-invalid
      AlarmDescription: '[tripwire] A served repo''s .github/dispatch.json fails its schema, so the dispatcher skips the repo: no pickup, no messages, no archiving. Read /governor for the dispatch-config-invalid line; it names the repo and the fault. Fix the file on the repo''s default branch (dispatch/repo-config.mjs holds the schema); the next fire serves the repo again.'
      Namespace: governor
      MetricName: ConfigInvalid
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A hook fire signed with a key version other than the one the repo's file
  # names (dispatch/hooks.mjs) starts nothing and logs `hook-key-stale`. Only
  # someone who once held a valid key can sign one, so the key may have
  # leaked. A stranger's unsigned post is the receiver's 401, and pages nobody.
  HookKeyStaleFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "hook-key-stale" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: HookKeysStale
          MetricValue: '1'
          DefaultValue: 0

  # The receiver refuses a key version older than the hook table's
  # (dispatch/webhook/route.mjs) and logs the same event, which pages the
  # same alarm. The receiver logs each line as one object, which Lambda's
  # JSON log format nests under `message`. Matched on that field alone: an
  # unsigned request's path and headers are logged too, and a term anywhere
  # in the line would let a stranger page the operator.
  WebhookHookKeyStaleFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebhookLogGroup
      FilterPattern: '{ $.message.event = "hook-key-stale" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: HookKeysStale
          MetricValue: '1'
          DefaultValue: 0

  HookKeyStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-hook-key-stale
      AlarmDescription: '[tripwire] A hook fire was signed with a key version its repo''s .github/dispatch.json has moved past, so it started nothing. Read /governor, or /aws/lambda/governor-webhook if the receiver refused it, for the hook-key-stale line; it names the repo, the hook and the version. Whoever sent it holds an old key: if the owner did not raise the version for a caller still to be moved, treat that key as leaked.'
      Namespace: governor
      MetricName: HookKeysStale
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A launch in a served repo that started nothing (a cloud environment the
  # file names wrongly, a login refused) skips the rest of that repo's
  # tickets for the fire, and logs `dispatch-repo-skipped` naming the repo
  # (dispatch/turn.mjs). The other repos still go.
  DispatchRepoSkippedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-repo-skipped" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: ReposSkipped
          MetricValue: '1'
          DefaultValue: 0

  DispatchRepoSkippedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-repo-skipped
      AlarmDescription: '[tripwire] A launch in a served repo started nothing, so the fire skipped the rest of that repo''s ready tickets. Read /governor for the dispatch-repo-skipped line; it names the repo, and the dispatch-launcher-output line before it says why. A wrong environment in the repo''s .github/dispatch.json is the repo''s to fix; a login refused is a re-mint (scripts/mint-claude-login.mjs).'
      Namespace: governor
      MetricName: ReposSkipped
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A periodic whose file names a claude.ai connector the account has not
  # connected starts nothing, writes no record, and logs
  # `dispatch-connector-missing` naming the repo, the periodic and the
  # connector (dispatch/turn.mjs). Each fire it comes due tries again, so
  # the alarm stays up until the connector is connected or the file changes.
  DispatchConnectorMissingFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-connector-missing" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: ConnectorsMissing
          MetricValue: '1'
          DefaultValue: 0

  DispatchConnectorMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-connector-missing
      AlarmDescription: '[tripwire] A periodic names a claude.ai connector the account has not connected, so its session did not start. Read /governor for the dispatch-connector-missing line; it names the repo, the periodic and the connector. Connect it on the claude.ai account under the name the file gives, or take it out of the repo''s .github/dispatch.json; the next fire the periodic comes due starts it.'
      Namespace: governor
      MetricName: ConnectorsMissing
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A periodic whose routine the routines API refused before the fire, a
  # 400 on the create or a routines list past one page among them, starts
  # nothing, writes no record, and logs `dispatch-routine-refused` naming
  # the repo and the periodic (dispatch/turn.mjs). The repo's tickets and
  # other periodics still start: the CLI is not at fault.
  DispatchRoutineRefusedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchLogGroup
      FilterPattern: '{ $.event = "dispatch-routine-refused" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: RoutinesRefused
          MetricValue: '1'
          DefaultValue: 0

  DispatchRoutineRefusedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-routine-refused
      AlarmDescription: '[tripwire] The routines API refused a periodic''s routine before the fire, so its session did not start; the repo''s other launches went on. Read /governor for the dispatch-routine-refused line; it names the repo and the periodic and says what the API answered, and the dispatch-routine-answer lines before it give each call''s shape. The periodic stays due, so the next fire tries again.'
      Namespace: governor
      MetricName: RoutinesRefused
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A schedule fire that never reached the receiver logs nothing: EventBridge
  # counts the invocation it could not make on the rule. A task RunTask
  # refused leaves its fire on the lane for the backstop, and the lane's
  # stall alarm pages if it stays.
  DispatchNotStartedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-not-started
      AlarmDescription: '[tripwire] EventBridge could not invoke the receiver for the schedule fire. Read the schedule rule''s failed invocations, then fire by hand: node scripts/run-turn.mjs --kind schedule.'
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref ScheduleRule
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A task RunTask started but whose container never ran (a pull refused, no
  # capacity to place it, an ENI that would not attach) logs nothing, and the
  # RunTask succeeded, so neither alarm above hears it. ECS says so on
  # the task's STOPPED event; this rule writes that whole event, stoppedReason
  # included, into the task's own log group, one stream per event, for the
  # operator to read, and hands it to the starter, which starts the next
  # attempt (dispatch/webhook/starter.mjs). The task never took a fire, so
  # the fire is still on the lane. The alarm below counts the rule's
  # matches. A task that ran its container stops with
  # EssentialContainerExited, whatever its exit code: that path is the
  # dispatch-failed filter's.
  DispatchNotRunRule:
    Type: AWS::Events::Rule
    Properties:
      Name: governor-not-run
      Description: A dispatcher task stopped without running its container
      State: ENABLED
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt DispatchCluster.Arn]
          lastStatus: [STOPPED]
          stopCode: [TaskFailedToStart]
      Targets:
        - Id: log
          Arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${DispatchLogGroup}'
        - Id: start
          Arn: !GetAtt StarterFunction.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  # A task that ran leaves only its container's output in /governor, so
  # nothing else records how long it took to start. This rule writes every
  # other stop event of the cluster there too, one stream per event: each
  # carries createdAt, pullStartedAt, pullStoppedAt, startedAt and stoppedAt.
  # It matches every stop code but TaskFailedToStart, which the not-run rule
  # writes, so the two rules never both write one event. A value filter
  # matches only a field the event carries, so a stop with no stopCode needs
  # the exists clause. No alarm counts its matches: every metric filter on
  # the group matches a top-level `event` key, which an ECS event lacks. It
  # also calls the starter, so a fire that landed while the task was
  # exiting, which saw the task still listed, starts the next task.
  DispatchTaskStoppedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: governor-task-stopped
      Description: A dispatcher task stopped, for its pull and start times
      State: ENABLED
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt DispatchCluster.Arn]
          lastStatus: [STOPPED]
          stopCode: [{ anything-but: [TaskFailedToStart] }, { exists: false }]
      Targets:
        - Id: log
          Arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${DispatchLogGroup}'
        - Id: start
          Arn: !GetAtt StarterFunction.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300

  # A log-group target takes no role: EventBridge writes on the group's
  # resource policy, both principals, the one group.
  DispatchEventsLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: governor-events
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"] },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${DispatchLogGroup.Arn}"
            }
          ]
        }

  # Counted on the rule's own matches, not off the log it writes: a write the
  # group's policy refused would leave this tripwire deaf (it is a
  # FailedInvocation, which DispatchNotRunUndeliveredAlarm reads). One stop is the starter's next attempt to absorb, so the
  # threshold is one chain's worth of attempts in the window
  # (dispatch/webhook/starter.mjs MAX_START_ATTEMPTS): stops the attempts are
  # not beating. A chain that runs out of attempts pages on its own
  # (StarterGaveUpAlarm).
  DispatchNotRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-not-run
      AlarmDescription: '[tripwire] Dispatcher tasks keep stopping without running their container, MAX_START_ATTEMPTS (dispatch/webhook/starter.mjs) or more in fifteen minutes. Read /governor for the ECS Task State Change events the stops logged; detail.stoppedReason says why (an image pull, a placement, an ENI). /aws/lambda/governor-starter says which attempts it started. The fires wait on the lane.'
      Namespace: AWS/Events
      MetricName: TriggeredRules
      Dimensions:
        - Name: RuleName
          Value: !Ref DispatchNotRunRule
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A stop event EventBridge could not hand the starter or the log group (a
  # throttle past the rule's retries, a permission gone) loses the stop's
  # record. The fire is not lost: it is on the lane, and the backstop
  # starts its task within a minute.
  DispatchNotRunUndeliveredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-not-run-undelivered
      AlarmDescription: '[tripwire] EventBridge could not deliver a dispatcher task''s stop event to the starter or the log group. Read the governor-not-run rule''s failed invocations. The fire waits on the lane, and the backstop starts its task within a minute; the stop''s record in /governor may be missing.'
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref DispatchNotRunRule
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ── The webhook receiver ───────────────────────────────────────────────────
  # GitHub posts the repository's issue, comment and review events here. An
  # issue labelled ready queues a schedule fire naming it, which the task
  # dispatches if the selection would; a mention of @claude by someone with
  # a say in the repository queues a dispatch fire with a prompt of its own
  # (dispatch/webhook/route.mjs, mention.mjs). The receiver starts nothing
  # itself: it calls the starter below once it has queued a request's fires.
  # The Function URL is unsigned by necessity, since GitHub cannot sign
  # SigV4; what keeps anyone else from queueing fires is the HMAC over every
  # body, keyed by the secret below, which the deploy workflow writes into
  # the App's webhook after every apply (scripts/point-app-webhook.mjs).
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: governor/webhook-secret
      Description: >-
        The HMAC key the webhook receiver verifies GitHub deliveries with;
        the same value goes into the repository webhook's Secret field.
        Generated here, read by the receiver, never written by anything.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # Every hook key's root. A served repo's file lists its hooks, each with a
  # key version, and a hook's key is the HMAC of its repo, name and version
  # under this secret (dispatch/webhook/hook.mjs), so governor stores no key.
  # The owner mints one with scripts/hook-key.mjs. Generated here, read by the
  # receiver and by the owner's own AWS identity; rotating it revokes every
  # hook's key at once.
  HookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: governor/hook-secret
      Description: >-
        The root every hook key is derived from. Generated here, read by the
        webhook receiver to verify a hook request, and by the owner's key
        script to mint a key. Never written by anything.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/governor-webhook
      RetentionInDays: 30

  # What the receiver may do: read its two keys and the hook table, queue a
  # fire, call the starter. Nothing else: the starter below is the one
  # thing that starts a task.
  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The webhook receiver's execution role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: receive
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadTheKeys
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref WebhookSecret
                  - !Ref HookSecret
              - Sid: QueueAFire
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DispatchFiresQueue.Arn
              # Once a request has queued its fires (dispatch/webhook/poke.mjs).
              - Sid: CallTheStarter
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt StarterFunction.Arn
              # A repo's listed hooks, read before a hook fire is queued, its
              # switches, read before a GitHub delivery's fires are queued,
              # and each hook's count of fires this hour, raised under its cap.
              # Nothing on the state table: the receiver faces the internet.
              - Sid: ReadAndCountTheHookTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DispatchHookTable.Arn
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebhookLogGroup.Arn

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: governor-webhook
      Description: Queues a dispatcher fire from a GitHub delivery or a signed hook
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: handler.handler
      # A local directory, uploaded by `aws cloudformation package` in the
      # workflow; dependency-free ESM over the runtime's own AWS SDK, so what
      # deploys is what is in the repo. The starter below is packaged from
      # the same directory.
      Code: ../dispatch/webhook/
      Role: !GetAtt WebhookRole.Arn
      MemorySize: 256
      Timeout: 20
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref WebhookLogGroup
      Environment:
        Variables:
          WEBHOOK_SECRET_ID: !Ref WebhookSecret
          HOOK_SECRET_ID: !Ref HookSecret
          HOOK_TABLE: !Ref DispatchHookTable
          DISPATCH_OWNERS: !Ref DispatchOwners
          SELECT_LABELS: !Ref SelectLabels
          FIRES_QUEUE_URL: !Ref DispatchFiresQueue
          STARTER_FUNCTION: !Ref StarterFunction
          APP_ID: !Ref GitHubAppId

  WebhookUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt WebhookFunction.Arn
      AuthType: NONE

  # The public needs both grants: a Function URL made after October 2025
  # answers 403 before the function runs on InvokeFunctionUrl alone (AWS's
  # urls-auth page), and the first registered hook's ping found that out.
  # InvokedViaFunctionUrl keeps the second to the URL: the Invoke API still
  # needs a signed caller the policy names (SchedulePermission, above).
  WebhookUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  WebhookUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebhookFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # The schedule reaches the receiver as an async invoke, which Lambda
  # retries on a function error a minute and then two minutes later; the
  # rule's own RetryPolicy covers EventBridge's delivery alone. Both retries
  # land inside the lane's five-minute deduplication window, so a schedule
  # fire the lane refused (a throttled SendMessage) is queued by the retry,
  # and one it took is not queued twice. Spelled out rather than left to the
  # default, with the age bound that keeps the retries inside the window.
  WebhookInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WebhookFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 300

  # ── The fire lane ──────────────────────────────────────────────────────────
  # Every fire, the schedule's and a delivery's, waits its turn here, and the
  # dispatcher task is its only reader: it takes the head fire, deletes it,
  # and runs it as its own turn, until the lane stays empty
  # (dispatch/lane.mjs). One task at a time is the starter's to keep, and one
  # turn at a time the task's: a dispatcher turn refreshes the stored login,
  # and two turns refreshing one login leave one of them dead. FIFO with one
  # message group keeps the fires in order; a delivery's id is its
  # deduplication id, so a redelivery is not a second fire, and the
  # schedule's identical body deduplicates itself within the five-minute
  # window.
  DispatchFiresQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: governor-fires.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      # How long a received fire stays hidden before the lane offers it
      # again. The task deletes a fire as it takes it, so this only matters
      # for a task that died between the two, or a delete that failed; the
      # lane's one group waits behind it meanwhile.
      VisibilityTimeout: 30
      # A fire a day old is stale: the schedule has fired since, and a
      # mention's author has long since looked.
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DispatchFiresDeadQueue.Arn
        # One reader deletes each fire as it takes it, so a fire received
        # this often without a delete is one whose task dies every time
        # between the two. It goes to the dead-letter queue rather than
        # hold the lane.
        maxReceiveCount: 5

  DispatchFiresDeadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: governor-fires-dead.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  StarterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/governor-starter
      RetentionInDays: 30

  # What the starter may do: count the lane, see whether a dispatcher task
  # is running, start one. Every task start is this role's. It takes
  # nothing off the lane: the task does.
  StarterRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The fire starter's execution role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CountTheLane
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !GetAtt DispatchFiresQueue.Arn
              # ListTasks takes no resource; the cluster condition keeps it
              # to this one.
              - Sid: SeeRunningTasks
                Effect: Allow
                Action: ecs:ListTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt DispatchCluster.Arn
              - Sid: RunTheTask
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/governor:*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt DispatchCluster.Arn
              - Sid: PassTheTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt DispatchRole.Arn
                  - !GetAtt DispatchExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StarterLogGroup.Arn

  StarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: governor-starter
      Description: Starts a dispatcher task when a fire waits on the lane and none runs
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: starter-handler.handler
      Code: ../dispatch/webhook/
      Role: !GetAtt StarterRole.Arn
      MemorySize: 256
      # Two ECS calls and an SQS call; the starter never waits.
      Timeout: 30
      # One call at a time, so two calls never both see no task and both
      # start one.
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref StarterLogGroup
      Environment:
        Variables:
          CLUSTER: !Ref DispatchCluster
          TASK_FAMILY: governor
          SUBNET_IDS: !Join [',', !Ref SubnetIds]
          # Counted: is a fire waiting?
          FIRES_QUEUE_URL: !Ref DispatchFiresQueue

  # Every call reaches the starter asynchronously: the receiver's, both stop
  # rules' and the backstop's. A call held back past a minute is stale: the
  # backstop has called since. The starter throws nothing, so no retry is
  # for a function error.
  StarterInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref StarterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60

  # The backstop: a poke or a stop event that never arrived, or a fire
  # queued with no poke (a by-hand fire, a turn's), starts within a minute.
  # The starter logs only when it starts a task, since that means a faster
  # path missed.
  StarterBackstopRule:
    Type: AWS::Events::Rule
    Properties:
      Name: governor-starter-backstop
      Description: Calls the starter every minute, in case a faster call missed a fire
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: start
          Arn: !GetAtt StarterFunction.Arn
          Input: '{"caller":"backstop"}'

  StarterBackstopPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StarterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StarterBackstopRule.Arn

  StarterNotRunPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StarterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispatchNotRunRule.Arn

  StarterTaskStoppedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StarterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispatchTaskStoppedRule.Arn

  # A chain of tasks that each failed to start, MAX_START_ATTEMPTS of them
  # (dispatch/webhook/starter.mjs): the starter gives up on the chain and
  # logs `start-gave-up`. Each line is one object, which Lambda's JSON log
  # format nests under `message`.
  StarterGaveUpFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref StarterLogGroup
      FilterPattern: '{ $.message.event = "start-gave-up" }'
      MetricTransformations:
        - MetricNamespace: governor
          MetricName: StartsGivenUp
          MetricValue: '1'
          DefaultValue: 0

  StarterGaveUpAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-start-gave-up
      AlarmDescription: '[tripwire] Dispatcher tasks failed to start MAX_START_ATTEMPTS (dispatch/webhook/starter.mjs) times in a row, so the starter gave up on them. Read /aws/lambda/governor-starter for the start-gave-up line, and /governor for the stops'' stoppedReason. The fires wait on the lane; the next poke or the backstop tries again.'
      Namespace: governor
      MetricName: StartsGivenUp
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # Every way the lane can stall shows as its oldest fire growing old:
  # RunTask refused at every call, a starter that cannot list or count, a
  # task that takes nothing. A burst waits its turns, so the threshold sits
  # well past one turn's deadline (dispatch/cli.mjs DEADLINE_MS).
  DispatchLaneStalledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-lane-stalled
      AlarmDescription: '[tripwire] A fire has waited on governor-fires.fifo for 45 minutes. Read /aws/lambda/governor-starter for start-failed lines, and /governor for the running task''s fire-taken and dispatch lines.'
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DispatchFiresQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2700
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A fire the task refused (dispatch/lane.mjs fire-refused), or one the
  # lane offered maxReceiveCount times without a delete.
  DispatchFiresDeadAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-fires-dead
      AlarmDescription: '[tripwire] A fire sits in governor-fires-dead.fifo: the dispatcher task refused it, or took it so often without deleting it that the lane gave up. Read /governor for the fire-refused or fire-untaken line naming its message id; the message''s reason attribute says why it was refused. Redrive the dead-letter queue once it is mended, or purge it.'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DispatchFiresDeadQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # A receiver that throws (a key it cannot read, a lane that refused the
  # fire: the receiver rethrows a failed SendMessage after logging it) is a
  # delivery lost until the next schedule fire; a refused signature is a 401
  # the receiver returns, not a throw, so a stranger probing the URL never
  # pages.
  WebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: governor-webhook-errors
      AlarmDescription: '[tripwire] The webhook receiver threw. Read /aws/lambda/governor-webhook for the delivery it was handling.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WebhookFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

# ─────────────────────────────────────────────────────────────────────────────
# Outputs — what scripts/run-turn.mjs reads to start a probe, or queue
# a fire and find the turn a task ran it in
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ClusterName:
    Value: !Ref DispatchCluster
  TaskDefinitionFamily:
    Value: governor
  ContainerName:
    Value: dispatch
  SubnetIds:
    Value: !Join [',', !Ref SubnetIds]
  LogGroupName:
    Value: !Ref DispatchLogGroup
  LogStreamPrefix:
    Value: task
  FiresQueueUrl:
    Value: !Ref DispatchFiresQueue

  WebhookUrl:
    Description: The App webhook's Payload URL, which the deploy writes (scripts/point-app-webhook.mjs).
    Value: !GetAtt WebhookUrl.FunctionUrl

  WebhookSecretArn:
    Description: Holds the webhook's Secret; the deploy workflow reads it and writes it into the repository webhook.
    Value: !Ref WebhookSecret
