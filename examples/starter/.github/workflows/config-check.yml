# Checks .github/dispatch.json on each pull request that changes it, with
# the code governor runs, so a file governor would refuse fails here rather
# than unserving the repo once it merges. The check runs here, on this
# repo's own token, pinned to a commit of gh-governor. To move to a newer
# check, change the commit after `@`, in `commit:` and in dispatch.json's
# `$schema` together, so the editor and the check read the same schema.
#
# If your prompts live in files ({ "file": "<path>" } in dispatch.json),
# add their paths under `paths:` too, so a change to one runs the check.
name: config check

on:
  pull_request:
    paths:
      - .github/dispatch.json

permissions:
  contents: read

jobs:
  check:
    uses: t-d-d/gh-governor/.github/workflows/config-check.yml@030ec89fd7f1a2ec6c80e37fc199256aa0dde358
    with:
      commit: 030ec89fd7f1a2ec6c80e37fc199256aa0dde358
