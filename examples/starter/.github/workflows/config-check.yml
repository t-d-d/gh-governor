# Checks .github/governor.json on each pull request that changes it, with
# the code governor runs, so a file governor would refuse fails here rather
# than unserving the repo once it merges. It also fails an issue template
# that names a ready label, so it runs when a template changes too. The check runs here, on this
# repo's own token, pinned to a commit of gh-governor. To move to a newer
# check, change the commit after `@`, in `commit:` and in governor.json's
# `$schema` together, so the editor and the check read the same schema.
#
# If your prompts live in files ({ "file": "<path>" } in governor.json),
# add their paths under `paths:` too, so a change to one runs the check.
name: config check

on:
  pull_request:
    paths:
      - .github/governor.json
      - .github/ISSUE_TEMPLATE/**
      - ISSUE_TEMPLATE.md
      - .github/ISSUE_TEMPLATE.md
      - docs/ISSUE_TEMPLATE.md

permissions:
  contents: read

jobs:
  check:
    uses: t-d-d/gh-governor/.github/workflows/config-check.yml@f57e63456f0a4dbc1edaba69a2bc833b3e306857
    with:
      commit: f57e63456f0a4dbc1edaba69a2bc833b3e306857
