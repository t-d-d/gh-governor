# The heartbeat checker a served repo calls, pinned to a commit of this repo,
# which it also passes as `commit`:
#
#   uses: t-d-d/gh-governor/.github/workflows/heartbeat-check.yml@<commit>
#   with:
#     commit: <commit>
#
# It reads the caller's config file and heartbeat issue, and keeps one issue
# open for each pickup sweep or periodic whose line has gone stale
# (checker/heartbeat-check.mjs). It runs in the served repo on the caller's
# own token, never in governor, and holds no secret or id. It uses no
# action: the steps fetch this repo at the commit with git and install the
# task's dependencies with npm, as the config check does, so the check is
# that commit's code, reading with governor's own config reader and
# heartbeat line reader.
#
# A called workflow cannot learn which commit of this repo it runs from, so
# the caller passes the commit as an input too.
name: heartbeat check

on:
  workflow_call:
    inputs:
      commit:
        description: The commit of gh-governor this workflow is pinned to, the same one as after `@` in `uses:`.
        type: string
        required: true
      tolerance-hours:
        description: How many hours past its limit a line may be before the check opens an issue. Cover the schedule fire's one-hour tick.
        type: number
        default: 3
      labels:
        description: The labels the check's issues carry, separated by commas or new lines.
        type: string
        default: ""

permissions: {}

jobs:
  check:
    name: heartbeat check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # One run at a time per repo, the next one queued, so two runs never
    # open the same issue twice.
    concurrency:
      group: governor-heartbeat-check
      cancel-in-progress: false
    steps:
      - name: Fetch governor at the pinned commit
        env:
          GOVERNOR_COMMIT: ${{ inputs.commit }}
        run: |
          # A whole-string match: grep would pass a value with one good line.
          if ! [[ "$GOVERNOR_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=heartbeat check::commit must be the 40-digit commit after @ in uses:"
            exit 1
          fi
          git init -q "$RUNNER_TEMP/governor"
          cd "$RUNNER_TEMP/governor"
          git fetch -q --depth 1 https://github.com/t-d-d/gh-governor.git "$GOVERNOR_COMMIT"
          git checkout -q FETCH_HEAD
          cd dispatch
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          # The task's image keeps its modules at the root, where both
          # dispatch/ and scripts/lib/ find them.
          mv node_modules ..

      - name: Check the heartbeat issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEARTBEAT_TOLERANCE_HOURS: ${{ inputs.tolerance-hours }}
          HEARTBEAT_LABELS: ${{ inputs.labels }}
        run: node "$RUNNER_TEMP/governor/checker/heartbeat-check.mjs"
