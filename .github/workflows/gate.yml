# The offline gate: the same `npm run gate` a contributor runs. It holds no
# secret and reaches no AWS account, so it runs on every push and every pull
# request, forks' included.
name: gate

on:
  # main is gated by deploy.yml, which calls this before it deploys.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      # The whole history, so test/starter-pin.test.ts can read the checker
      # at the commit the starter kit pins and check it is on main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate
