# The offline gate: the same `npm run gate` a contributor runs. It holds no
# secret and reaches no AWS account, so it is safe to run on any pull
# request, a fork's included.
#
# It gates pull requests, not branch pushes. Gating both meant skipping the
# pull request job for a branch here, and GitHub reports a skipped job as a
# passed check named `gate`. Every pull request then carried a second `gate`
# check that read as passed while the real one was still running. A branch
# with no pull request gets no run; a session raises its pull request
# straight after its push.
name: gate

on:
  # main is gated by deploy.yml and pages.yml, which call this before they
  # publish.
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      # The whole history, so test/starter-pin.test.ts can read the checker
      # at the commit the starter kit pins and check it is on main. On a pull
      # request this checks out the merge of the head into main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate
