# The offline gate: the same `npm run gate` a contributor runs. It holds no
# secret and reaches no AWS account, so it is safe to run on every push and
# on a fork's pull request.
#
# A branch pushed here is gated by its push run, so its pull request run
# skips the job rather than gate the same commit twice. A fork's pull request
# has no push run here, so its pull request run is what gates it.
name: gate

on:
  # main is gated by deploy.yml and pages.yml, which call this before they
  # publish.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      # The whole history, so test/starter-pin.test.ts can read the checker
      # at the commit the starter kit pins and check it is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate
