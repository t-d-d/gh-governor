# Moves each outside action's pinned commit, and the tag comment beside it,
# to the action's newest release. "/" covers .github/workflows. The glob
# covers each composite action one level under .github/actions; a deeper
# one needs its own line, and test/action-pins.test.ts says so.
# The cooldown holds back a release until it is 7 days old: the deploy job
# runs these actions with an administrator role, and a week gives a
# compromised release time to be found and pulled. Each action keeps its own
# pull request, so there are no groups.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
